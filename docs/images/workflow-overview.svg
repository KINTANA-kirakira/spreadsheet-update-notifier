<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Spreadsheet update notification workflow</title>
  <desc id="desc">Google Sheets rows are checked by Google Apps Script, then new rows are sent to Discord and Gmail.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="960" height="420" rx="24" fill="#f8fafc"/>
  <text x="48" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Spreadsheet Update Notifier</text>
  <text x="48" y="84" font-family="Arial, sans-serif" font-size="15" fill="#475569">New spreadsheet rows are detected and delivered to the right notification channels.</text>

  <g filter="url(#shadow)">
    <rect x="52" y="145" width="210" height="120" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="82" y="182" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Google Sheets</text>
    <text x="82" y="213" font-family="Arial, sans-serif" font-size="14" fill="#475569">Responses sheet</text>
    <text x="82" y="237" font-family="Arial, sans-serif" font-size="14" fill="#475569">New inquiry/order rows</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="374" y="128" width="230" height="154" rx="18" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="404" y="166" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1e3a8a">Apps Script</text>
    <text x="404" y="197" font-family="Arial, sans-serif" font-size="14" fill="#1e40af">Time-driven trigger</text>
    <text x="404" y="221" font-family="Arial, sans-serif" font-size="14" fill="#1e40af">Notification ID tracking</text>
    <text x="404" y="245" font-family="Arial, sans-serif" font-size="14" fill="#1e40af">Retry only failed channels</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="718" y="110" width="190" height="92" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="750" y="148" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Discord</text>
    <text x="750" y="174" font-family="Arial, sans-serif" font-size="14" fill="#475569">Webhook message</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="718" y="236" width="190" height="92" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="750" y="274" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Gmail</text>
    <text x="750" y="300" font-family="Arial, sans-serif" font-size="14" fill="#475569">Email notification</text>
  </g>

  <line x1="262" y1="205" x2="360" y2="205" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="604" y1="180" x2="704" y2="156" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="604" y1="230" x2="704" y2="282" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="118" y="318" width="724" height="54" rx="12" fill="#e0f2fe" stroke="#7dd3fc"/>
  <text x="148" y="351" font-family="Arial, sans-serif" font-size="15" fill="#075985">Prevents duplicate notifications by storing notification IDs and delivery status in protected management columns.</text>
</svg>
